[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "docgraph"
version = "0.1.0"
description = "A Python-first, schema-driven framework for building knowledge graphs from documentation, with optional AI-powered extraction."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "DocGraph contributors" }
]
keywords = ["documentation", "knowledge-graph", "markdown", "ontology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "markdown-it-py>=3.0.0",
  "networkx>=3.3",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
ollama = []
all = ["openai>=1.40.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
docgraph = "docgraph.cli:app"

[project.urls]
Homepage = "https://github.com/docgraph/docgraph"
Issues = "https://github.com/docgraph/docgraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/docgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
