name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'
    - name: Install dependencies (conda if available, else pip)
      run: |
        if [ -f environment.yml ]; then
          echo "environment.yml found — installing via conda"
          wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p $HOME/miniconda
          echo "$HOME/miniconda/bin" >> $GITHUB_PATH
          export PATH="$HOME/miniconda/bin:$PATH"
          source $HOME/miniconda/etc/profile.d/conda.sh || true
          conda activate base || true
          conda env update --file environment.yml --name base || conda env create --file environment.yml --name base
        else
          echo "No environment.yml — installing project and dev deps via pip"
          python -m pip install --upgrade pip
          # Install the package (and dev extras) so runtime deps like pydantic and typer are available
          pip install -e ".[dev]" || pip install .
          # Ensure flake8 is available for lint step
          pip install flake8
        fi
    - name: Lint with flake8
      run: |
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
